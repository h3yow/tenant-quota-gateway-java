# ===== 多租户限流/配额网关配置 =====

# 携带租户标识的请求头
tenant-quota.tenant-header=X-Tenant-Id
# 携带幂等键的请求头（留空则不启用幂等去重）
tenant-quota.idempotency-header=Idempotency-Key
# 携带请求标识的请求头（缺失时自动生成）
tenant-quota.request-id-header=X-Request-Id

# 策略文件位置（classpath: 或 file:）
tenant-quota.policy-location=classpath:policies.json

# 配置/内部状态不可用时的降级策略：false=fail-closed 明确拒绝(503)，true=fail-open 放行
tenant-quota.fail-open=false

# 幂等记录保留时长（毫秒），默认 24 小时
tenant-quota.idempotency-ttl-millis=86400000

# 内存审计记录保留条数
tenant-quota.audit-buffer-size=1000

# 是否开放 /admin 管理接口（策略刷新、租户状态、审计查看）
tenant-quota.admin-endpoints-enabled=true

# ===== 预占（先占用、后结算）相关配置 =====
# 预占占用的最长保留时长（毫秒）：超时未结算的占用自动失效释放，迟到结算不再生效
tenant-quota.reservation-ttl-millis=900000
# 后台超时扫描间隔（毫秒）；<=0 关闭后台扫描（请求路径仍会惰性释放，正确性不受影响）
tenant-quota.reservation-sweep-interval-millis=10000
# 已结算/已失效预占记录的保留时长（毫秒）：用于迟到/重复结算的去重判定
tenant-quota.reservation-record-ttl-millis=86400000

# 审计日志独立输出到文件（与控制台日志分开，便于检查判定依据）
logging.level.AUDIT=INFO
